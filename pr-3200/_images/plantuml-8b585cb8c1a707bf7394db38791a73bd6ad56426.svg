="29.9736" x="335.3257" y="555.5747">[05]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.3301" x="369.2993" y="555.5747">notify event</text><line style="stroke:#181818;stroke-width:1;" x1="62.1118" x2="72.1118" y1="589.7734" y2="585.7734"/><line style="stroke:#181818;stroke-width:1;" x1="62.1118" x2="72.1118" y1="589.7734" y2="593.7734"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="61.1118" x2="317.3257" y1="589.7734" y2="589.7734"/><text fill="#FF0000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="29.9736" x="78.1118" y="584.7075">[06]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.9775" x="112.0854" y="584.7075">invoke handler(event)</text><path d="M9.1121,616.7734 L9.1121,686.7734 L557.1121,686.7734 L557.1121,626.7734 L547.1121,616.7734 L9.1121,616.7734 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M547.1121,616.7734 L547.1121,626.7734 L557.1121,626.7734 L547.1121,616.7734 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="399.8389" x="60.8672" y="633.8403">The PTP payload data (sync-fup / pdelay) is available only via</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="435.9443" x="60.8672" y="648.9731">subscription. The Vehicle Time status can also be read from now();</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.9829" x="60.8672" y="664.106">subscription additionally delivers it on change.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.5151" x="60.8672" y="679.2388">Main use case: diagnostics.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="836.