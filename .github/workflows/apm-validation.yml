on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  apm-validation:
    uses: eclipse-score/cicd-workflows/.github/workflows/apm-validation.yml@apm_consumer_migration
    permissions:
      contents: read
