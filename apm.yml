# APM manifest for the S-CORE platform agent.
#
# Local primitives live in .apm/ (source layout) and are deployed to .github/
# for the copilot target. Marketplace packages are pulled from the central
# eclipse-score agent marketplace (eclipse-score/mcp-servers).

name: score-platform-agent
version: 1.0.0
description: Development agent for the Eclipse S-CORE automotive middleware platform
license: Apache-2.0
targets:
  - copilot

# Explicit consent list: only the local .apm/ source layout is deployed.
includes:
  - .apm/

dependencies:
  apm:
    # Central eclipse-score agent marketplace (eclipse-score/mcp-servers).
    # Each entry is a virtual package: a subdirectory of the marketplace repo,
    # pinned to the marketplace release tag.
    - eclipse-score/mcp-servers/packages/apm-setup#v0.2.0
    - eclipse-score/mcp-servers/packages/context-discipline#v0.2.0
    - eclipse-score/mcp-servers/packages/graphify-codegraph#v0.2.0
    - eclipse-score/mcp-servers/packages/sdlc-harness#v0.2.0
    - eclipse-score/mcp-servers/packages/metamodel-flow#v0.2.0
