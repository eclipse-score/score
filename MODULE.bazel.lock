                "BUILD.bazel": "###############################################################################\n# @generated\n# DO NOT MODIFY: This file is auto-generated by a crate_universe tool. To \n# regenerate this file, run the following:\n#\n#     bazel mod show_repo 'score_tooling'\n###############################################################################\n\npackage(default_visibility = [\"//visibility:public\"])\n\nexports_files(\n    [\n        \"cargo-bazel.json\",\n        \"crates.bzl\",\n        \"defs.bzl\",\n    ] + glob(\n        allow_empty = True,\n        include = [\"*.bazel\"],\n    ),\n)\n\nfilegroup(\n    name = \"srcs\",\n    srcs = glob(\n        allow_empty = True,\n        include = [\n            \"*.bazel\",\n            \"*.bzl\",\n        ],\n    ),\n)\n\n# Workspace Member Dependencies\nalias(\n    name = \"assert-json-diff-2.0.2\",\n    actual = \"@crates__assert-json-diff-2.0.2//:assert_json_diff\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"assert-json-diff\",\n    actual = \"@crates__assert-json-diff-2.0.2//:assert_json_diff\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"clang-1.0.3\",\n    actual = \"@crates__clang-1.0.3//:clang\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"clang\",\n    actual = \"@crates__clang-1.0.3//:clang\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"clang-sys-1.8.1\",\n    actual = \"@crates__clang-sys-1.8.1//:clang_sys\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"clang-sys\",\n    actual = \"@crates__clang-sys-1.8.1//:clang_sys\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"clap-4.6.6\",\n    actual = \"@crates__clap-4.6.6//:clap\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"clap\",\n    actual = \"@crates__clap-4.6.6//:clap\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"env_logger-0.10.2\",\n    actual = \"@crates__env_logger-0.10.2//:env_logger\",\n    tags = [\"manual\"],\n)\n\nalias(\n    name = \"env_logger\",\n    a